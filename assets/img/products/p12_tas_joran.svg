<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </radialGradient>
        <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
    <rect width="500" height="500" rx="24" fill="url(#gridPattern)"/>

    <!-- Subtle Center Glow -->
    <circle cx="250" cy="240" r="180" fill="url(#glowGrad)"/>

    <!-- Brand Badge Top Right -->
    <rect x="340" y="24" width="130" height="32" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="405" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">RELIX</text>

    <!-- Category Pill Top Left -->
    <rect x="30" y="24" width="150" height="32" rx="16" fill="#38bdf8" opacity="0.2"/>
    <rect x="30" y="24" width="150" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">AKSESORIS</text>

    <!-- Main Graphic Centerpiece -->
    <g filter="url(#shadow)">
        
            <!-- Tackle Bag / Case -->
            <rect x="140" y="180" width="220" height="150" rx="20" fill="none" stroke="#38bdf8" stroke-width="10"/>
            <path d="M140 240 L360 240" stroke="#ffffff" stroke-width="4" stroke-dasharray="6,4"/>
            <rect x="200" y="150" width="100" height="30" rx="8" fill="none" stroke="#38bdf8" stroke-width="8"/>
            <circle cx="250" cy="240" r="12" fill="#38bdf8"/>
            
    </g>

    <!-- Bottom Product Info Overlay -->
    <rect x="25" y="405" width="450" height="70" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="45" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">TAS HARDCASE JORAN</text>
    <text x="45" y="457" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">Waterproof Tabung Guard 120cm</text>

    <!-- Water Waves Accent -->
    <path d="M 370 445 Q 390 435 410 445 T 450 445" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.7"/>
</svg>
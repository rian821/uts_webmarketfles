<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#365314"/>
            <stop offset="100%" stop-color="#1a2e05"/>
        </linearGradient>
        <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#a3e635" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
        </radialGradient>
        <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
    <rect width="500" height="500" rx="24" fill="url(#gridPattern)"/>

    <!-- Subtle Center Glow -->
    <circle cx="250" cy="240" r="180" fill="url(#glowGrad)"/>

    <!-- Brand Badge Top Right -->
    <rect x="340" y="24" width="130" height="32" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="405" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">MAGURO</text>

    <!-- Category Pill Top Left -->
    <rect x="30" y="24" width="150" height="32" rx="16" fill="#a3e635" opacity="0.2"/>
    <rect x="30" y="24" width="150" height="32" rx="16" fill="none" stroke="#a3e635" stroke-width="1.5"/>
    <text x="105" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a3e635" text-anchor="middle" letter-spacing="1">CASTING GABUS</text>

    <!-- Main Graphic Centerpiece -->
    <g filter="url(#shadow)">
        
            <!-- Minnow Lure Graphic -->
            <path d="M140 250 Q 220 190 340 230 Q 360 250 340 270 Q 220 310 140 250 Z" fill="#a3e635" stroke="#ffffff" stroke-width="4"/>
            <polygon points="140,250 110,225 110,275" fill="#a3e635"/>
            <circle cx="315" cy="240" r="7" fill="#ffffff"/>
            <circle cx="316" cy="240" r="3.5" fill="#000000"/>
            <path d="M340 250 L375 275" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
            <path d="M230 290 Q 220 320 205 320" stroke="#ffffff" stroke-width="3" fill="none"/>
            <path d="M300 280 Q 290 310 275 310" stroke="#ffffff" stroke-width="3" fill="none"/>
            
    </g>

    <!-- Bottom Product Info Overlay -->
    <rect x="25" y="405" width="450" height="70" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="45" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">SOFT FROG KILLER</text>
    <text x="45" y="457" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#a3e635">Topwater Double Hook Anti Sangkut</text>

    <!-- Water Waves Accent -->
    <path d="M 370 445 Q 390 435 410 445 T 450 445" fill="none" stroke="#a3e635" stroke-width="2.5" opacity="0.7"/>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#14532d"/>
            <stop offset="100%" stop-color="#052e16"/>
        </linearGradient>
        <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4ade80" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
        </radialGradient>
        <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
    <rect width="500" height="500" rx="24" fill="url(#gridPattern)"/>

    <!-- Subtle Center Glow -->
    <circle cx="250" cy="240" r="180" fill="url(#glowGrad)"/>

    <!-- Brand Badge Top Right -->
    <rect x="340" y="24" width="130" height="32" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="405" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">DURAKING</text>

    <!-- Category Pill Top Left -->
    <rect x="30" y="24" width="150" height="32" rx="16" fill="#4ade80" opacity="0.2"/>
    <rect x="30" y="24" width="150" height="32" rx="16" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="105" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="1">SENAR BRAID PE</text>

    <!-- Main Graphic Centerpiece -->
    <g filter="url(#shadow)">
        
            <!-- Line Spool Graphic -->
            <ellipse cx="250" cy="250" rx="95" ry="45" fill="none" stroke="#4ade80" stroke-width="12"/>
            <ellipse cx="250" cy="210" rx="95" ry="45" fill="rgba(255,255,255,0.08)" stroke="#f1f5f9" stroke-width="8"/>
            <path d="M155 210 L155 250 A 95 45 0 0 0 345 250 L345 210 Z" fill="#4ade80" opacity="0.8"/>
            <circle cx="250" cy="210" r="30" fill="#0f172a" stroke="#4ade80" stroke-width="4"/>
            <path d="M345 230 Q 390 220 410 260" stroke="#ffffff" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
            
    </g>

    <!-- Bottom Product Info Overlay -->
    <rect x="25" y="405" width="450" height="70" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="45" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">DURAKING NATUNA X8</text>
    <text x="45" y="457" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4ade80">300m Multicolor Braided Line</text>

    <!-- Water Waves Accent -->
    <path d="M 370 445 Q 390 435 410 445 T 450 445" fill="none" stroke="#4ade80" stroke-width="2.5" opacity="0.7"/>
</svg>